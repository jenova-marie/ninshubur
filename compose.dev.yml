# Local development overlay — boots a postgres only.
# `docker compose -f compose.dev.yml up -d` and run the bot with `pnpm dev`.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ninshubur
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - ninshubur-pg-dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ninshubur"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ninshubur-pg-dev:
